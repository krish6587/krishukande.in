<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Krish Kumar Ukande</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b0d10" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0b0d10;
        color: #efeee9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 1.5rem;
        overflow: hidden;
        position: relative;
      }
      .glow {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 600px; height: 600px;
        background: rgba(127, 231, 196, 0.03);
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
      }
      h1 {
        font-size: clamp(8rem, 20vw, 16rem);
        font-weight: 900;
        background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.03));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        letter-spacing: -0.05em;
        user-select: none;
      }
      .content { position: relative; z-index: 1; margin-top: -1rem; }
      .content p { margin-bottom: 0.5rem; }
      .title { font-size: 1.25rem; font-weight: 700; color: #fff; }
      .subtitle { font-size: 0.875rem; color: #9ca3af; max-width: 28rem; margin: 0 auto 2rem; line-height: 1.6; }
      .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      .btn {
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.75rem 1.5rem; border-radius: 0.75rem;
        font-size: 0.875rem; font-weight: 700;
        text-decoration: none; transition: all 0.2s;
      }
      .btn-primary {
        background: #7fe7c4; color: #06231a; border: none;
      }
      .btn-primary:hover { background: #93edcf; transform: scale(1.02); }
      .btn-secondary {
        background: transparent; color: #d1d5db;
        border: 1px solid #22262c; cursor: pointer;
      }
      .btn-secondary:hover { border-color: #6b7280; color: #fff; background: rgba(255,255,255,0.04); }
      .footer {
        position: absolute; bottom: 1.5rem;
        font-size: 0.75rem; color: #4b5563;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <h1>404</h1>
    <div class="content">
      <p class="title">Page not found</p>
      <p class="subtitle">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">
          ← Back to Home
        </a>
        <button onclick="history.back()" class="btn btn-secondary">
          Go Back
        </button>
      </div>
    </div>
    <p class="footer">© 2026 Krish Kumar Ukande</p>
  </body>
</html>
